# GeoAICubes demo configuration (provisional — align with ICGC KO gate).
# Secrets: set MinIO keys via env (GEOAICUBES_STORAGE__ACCESS_KEY_ID, etc.), not here.

name: geoaicubes-demo

# CRS: bbox below is WGS84 (EPSG:4326). Process/export rasters under data/ in EPSG:25831
# unless ICGC KO says otherwise. `crs` is API/export metadata — see docs/demo-config.md.
crs: EPSG:4326

# Confirm with ICGC: demo AOI (Montseny illustrative bbox).
bbox:
  min_lon: 2.35
  min_lat: 41.75
  max_lon: 2.55
  max_lat: 41.95

# Confirm with ICGC: cube time range and band set tied to these dates.
dates:
  start: "2019-01-01"
  end: "2021-12-31"

paths:
  # All relative paths below resolve under this root (gitignored); see docs/demo-config.md.
  data_root: data
  # Confirm with ICGC: final Zarr layout and filenames after datacloud fetch.
  cube_zarr: geodatacubes/montseny-demo.zarr
  label_raster: cobertes-sol/labels/montseny_labels.tif
  classification_output: derived/classification_montseny.tif
  change_map_output: derived/change_map_montseny.tif

# Confirm with ICGC: class ids and names for Catalan land-cover demo.
classes:
  - id: 0
    name: unclassified
    color: "#cccccc"
  - id: 1
    name: forest
    color: "#228822"
  - id: 2
    name: agriculture
    color: "#e6c84a"
  - id: 3
    name: urban
    color: "#aa4444"
  - id: 4
    name: water
    color: "#3366cc"

storage:
  endpoint_url: http://localhost:9000
  bucket: geoaicubes-demo
  prefix: montseny/
  region: us-east-1
  use_ssl: false

# Optional; viewer may use VITE_API_BASE_URL instead.
api_base_url: http://localhost:8000