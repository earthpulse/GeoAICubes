[project]
name = "geoaicubes"
version = "0.1.0"
description = "EarthPulse GeoAICubes — ICGC datacloud demo stack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "geopandas>=1.2.0",
    "jupyter>=1.1.1",
    "leafmap>=0.64.7",
    "matplotlib>=3.11.2",
    "pydantic-settings>=2.6",
    "s3fs>=2024.6.0",
    "titiler-xarray[full]>=2.4.1",
    "typer>=0.15,<1",
    "uvicorn[standard]>=0.32,<1",
    "xarray>=2026.9.0",
    "zarr>=3.4.2",
]

[project.scripts]
geoaicubes = "geoaicubes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoaicubes"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests/integration", "tests/unit"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ERA", "RUF"]
