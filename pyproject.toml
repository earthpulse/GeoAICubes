[project]
name = "geoaicubes"
version = "0.1.0"
description = "EarthPulse GeoAICubes — ICGC datacloud demo stack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0.2,<7",
    "typer>=0.15,<1",
    "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
geoaicubes = "geoaicubes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoaicubes"]